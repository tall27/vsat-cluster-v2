name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build linux/amd64 binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o out/vsat-webapp ./cmd/vsat-webapp

      - name: Package scripts
        run: tar -C . -czf out/scripts.tar.gz scripts

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        run: |
          gh release create latest \
            --title "Latest ($(git log -1 --format='%h %s'))" \
            --notes "Auto-built from master at $(git log -1 --format='%H')" \
            out/vsat-webapp out/scripts.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
