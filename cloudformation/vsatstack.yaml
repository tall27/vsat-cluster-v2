AWSTemplateFormatVersion: '2010-09-09'
Description: VSAT Cluster v2 EC2 workload stack with gp3 COW block device and quickstart UserData.

Parameters:
  CustomerName:
    Type: String
  InstanceType:
    Type: String
    Default: t3a.xlarge
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  RootVolumeSizeGiB:
    Type: Number
    Default: 8
  CowVolumeSizeGiB:
    Type: Number
    Default: 40
  CowVolumeIops:
    Type: Number
    Default: 3000
  CowVolumeThroughput:
    Type: Number
    Default: 125

Resources:
  VsatInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - SA_Launch_POC_Guacamole_EC2_Role

  VsatInstanceAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-vsat-instance-access'
      Roles:
        - SA_Launch_POC_Guacamole_EC2_Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:UpdateInstanceInformation
            Resource: '*'
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::akush
            Condition:
              StringLike:
                s3:prefix:
                  - vsat-cluster/*
                  - vsat-cluster/
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - arn:aws:s3:::akush/vsat-cluster/*

  VsatInstance:
    Type: AWS::EC2::Instance
    DependsOn: VsatInstanceAccessPolicy
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref VsatInstanceProfile
      SourceDestCheck: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
        - DeviceName: /dev/sdf
          Ebs:
            VolumeSize: !Ref CowVolumeSizeGiB
            VolumeType: gp3
            Iops: !Ref CowVolumeIops
            Throughput: !Ref CowVolumeThroughput
            DeleteOnTermination: true
            Encrypted: true
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroupId
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          PrivateIpAddresses:
            - PrivateIpAddress: 10.0.1.20
              Primary: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: optional
        InstanceMetadataTags: enabled
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a /var/log/vsat-cluster-userdata.log) 2>&1
          echo "[userdata] $(date -Is) starting VSAT Cluster quickstart"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl
          for attempt in $(seq 1 60); do
            if [ -b /dev/nvme1n1 ]; then
              break
            fi
            echo "[userdata] waiting for /dev/nvme1n1 (${!attempt}/60)"
            sleep 5
          done
          if [ ! -b /dev/nvme1n1 ]; then
            echo "[userdata] /dev/nvme1n1 was not attached"
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/tall27/vsat-cluster-v2/master/scripts/quickstart.sh | sudo VSAT_COW_DEVICE=/dev/nvme1n1 bash
          echo "[userdata] $(date -Is) quickstart finished"
      Tags:
        - Key: Name
          Value: !Sub '${CustomerName}-vsat-cluster'
        - Key: CustomerName
          Value: !Ref CustomerName
        - Key: Role
          Value: vsat-cluster-host

Outputs:
  InstanceId:
    Value: !Ref VsatInstance
  PublicIp:
    Value: !GetAtt VsatInstance.PublicIp
  PublicDnsName:
    Value: !GetAtt VsatInstance.PublicDnsName
