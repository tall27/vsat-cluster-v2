AWSTemplateFormatVersion: '2010-09-09'
Description: VSAT Cluster v2 EC2 workload stack with raw gp3 COW volume and quickstart UserData.

Parameters:
  CustomerName:
    Type: String
  InstanceType:
    Type: String
    Default: t3a.medium
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  RootVolumeSizeGiB:
    Type: Number
    Default: 8
  CowVolumeSizeGiB:
    Type: Number
    Default: 40
  CowVolumeIops:
    Type: Number
    Default: 3000
  CowVolumeThroughput:
    Type: Number
    Default: 125

Resources:
  VsatInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SourceDestCheck: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroupId
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          PrivateIpAddresses:
            - PrivateIpAddress: 10.0.1.20
              Primary: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: optional
        InstanceMetadataTags: enabled
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a /var/log/vsat-cluster-userdata.log) 2>&1
          echo "[userdata] $(date -Is) starting VSAT Cluster quickstart"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl
          for attempt in $(seq 1 60); do
            if [ -b /dev/nvme1n1 ]; then
              break
            fi
            echo "[userdata] waiting for /dev/nvme1n1 (${!attempt}/60)"
            sleep 5
          done
          if [ ! -b /dev/nvme1n1 ]; then
            echo "[userdata] /dev/nvme1n1 was not attached"
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/tall27/vsat-cluster-v2/master/scripts/quickstart.sh | sudo VSAT_COW_DEVICE=/dev/nvme1n1 bash
          echo "[userdata] $(date -Is) quickstart finished"
      Tags:
        - Key: Name
          Value: !Sub '${CustomerName}-vsat-cluster'
        - Key: CustomerName
          Value: !Ref CustomerName
        - Key: Role
          Value: vsat-cluster-host

  CowVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt VsatInstance.AvailabilityZone
      VolumeType: gp3
      Size: !Ref CowVolumeSizeGiB
      Iops: !Ref CowVolumeIops
      Throughput: !Ref CowVolumeThroughput
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${CustomerName}-lxd-cow'
        - Key: CustomerName
          Value: !Ref CustomerName
        - Key: Purpose
          Value: vsat-lxd-cow
        - Key: Filesystem
          Value: unformatted

  CowVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref VsatInstance
      VolumeId: !Ref CowVolume

Outputs:
  InstanceId:
    Value: !Ref VsatInstance
  PublicIp:
    Value: !GetAtt VsatInstance.PublicIp
  PublicDnsName:
    Value: !GetAtt VsatInstance.PublicDnsName
  CowVolumeId:
    Value: !Ref CowVolume
