{{define "title"}}Monitoring · VSAT Cluster{{end}}
{{define "content"}}
<div class="page-head">
  <div>
    <h1>Monitoring</h1>
    <p class="muted">Host and container utilization updated every 5 seconds</p>
  </div>
  <div>
    <a class="btn btn-ghost" href="/">⟵ Back</a>
  </div>
</div>

<div class="card">
  <table class="monitoring-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type / status</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>Disk I/O</th>
        <th>Network</th>
      </tr>
    </thead>
    <tbody id="monitoring-body">
      <tr>
        <td colspan="6" class="empty">Loading…</td>
      </tr>
    </tbody>
  </table>
</div>
{{end}}

{{define "scripts"}}
<script>
(function() {
  const body = document.getElementById('monitoring-body');
  const refreshMs = 5000;

  const icons = {
    host: `{{template "icon-host" .}}`,
    container: `{{template "icon-container" .}}`,
    cpu: `{{template "icon-cpu" .}}`,
    memory: `{{template "icon-memory" .}}`,
    disk: `{{template "icon-disk" .}}`,
    network: `{{template "icon-network" .}}`,
  };

  function classFor(value) {
    if (value >= 80) return 'bar-critical';
    if (value >= 70) return 'bar-warning';
    return 'bar-normal';
  }

  function formatPercent(value) {
    if (value === undefined || value === null) return '--';
    return `${value.toFixed(1)} %`;
  }

  function formatBytes(value) {
    if (value === undefined || value === null) return '--';
    const units = ['B/s', 'KiB/s', 'MiB/s', 'GiB/s'];
    let v = value;
    let i = 0;
    while (v >= 1024 && i < units.length - 1) {
      v /= 1024;
      i += 1;
    }
    return `${v.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
  }

  function renderRow(row) {
    return `
      <tr>
        <td class="mono">${row.name || '--'}</td>
        <td>
          <span class="type-label ${row.type === 'Host' ? 'type-host' : 'type-container'}">
            ${row.type === 'Host' ? icons.host : icons.container}
            ${row.type || '--'} ${row.status || ''}
          </span>
        </td>
        <td>${metricCell(row.cpuUtilization, row.type === 'Host' ? ['Host cpu', row.cpuUtilization] : ['CPU', row.cpuUtilization])}</td>
        <td>${memoryCell(row)}</td>
        <td>${ioCell(row)}</td>
        <td>${networkCell(row)}</td>
      </tr>
    `;
  }

  function metricCell(percent, fallback) {
    if (percent === undefined || percent === null) {
      return `<div class="metric-mini">--</div>`;
    }
    return `
      <div class="metric-mini">
        ${icons.cpu}
        <span>${fallback && fallback[0] ? fallback[0] : ''}</span>
      </div>
      <div class="metric-bar-wrap">
        <div class="metric-bar ${classFor(percent)}" style="width: ${Math.max(0, Math.min(100, percent))}%;"></div>
      </div>
      <div class="metric-val">${formatPercent(percent)}</div>
    `;
  }

  function memoryCell(row) {
    if (row.memoryUtilization === undefined || row.memoryUtilization === null || row.memoryTotalBytes === undefined || row.memoryTotalBytes === null || row.memoryFreeBytes === undefined || row.memoryFreeBytes === null) {
      return `<div class="metric-mini">${icons.memory}<span>Memory</span></div><div class="metric-mini">--</div>`;
    }
    return `
      <div class="metric-mini">${icons.memory}<span>Memory</span></div>
      <div class="metric-bar-wrap">
        <div class="metric-bar ${classFor(row.memoryUtilization)}" style="width: ${Math.max(0, Math.min(100, row.memoryUtilization))}%;"></div>
      </div>
      <div class="metric-val">${formatPercent(row.memoryUtilization)}</div>
      <div class="metric-sub">${formatBytes(row.memoryTotalBytes)} total · ${formatBytes(row.memoryFreeBytes)} free</div>
    `;
  }

  function ioCell(row) {
    const util = row.ioUtilization;
    const read = formatBytes(row.ioReadBytesPerSec);
    const write = formatBytes(row.ioWriteBytesPerSec);
    return `
      <div class="metric-mini">${icons.disk}<span>Disk I/O</span></div>
      ${util === undefined || util === null ? '<div class="metric-mini">--</div>' : `
      <div class="metric-bar-wrap"><div class="metric-bar ${classFor(util)}" style="width: ${Math.max(0, Math.min(100, util))}%;"></div></div>
      <div class="metric-val">${formatPercent(util)}</div>`}
      <div class="metric-sub">R: ${read} · W: ${write}</div>
    `;
  }

  function networkCell(row) {
    const util = row.networkUtilization;
    const rx = formatBytes(row.networkRxBytesPerSec);
    const tx = formatBytes(row.networkTxBytesPerSec);
    return `
      <div class="metric-mini">${icons.network}<span>Network</span></div>
      ${util === undefined || util === null ? '<div class="metric-mini">--</div>' : `
      <div class="metric-bar-wrap"><div class="metric-bar ${classFor(util)}" style="width: ${Math.max(0, Math.min(100, util))}%;"></div></div>
      <div class="metric-val">${formatPercent(util)}</div>`}
      <div class="metric-sub">Rx: ${rx} · Tx: ${tx}</div>
    `;
  }

  async function poll() {
    let response;
    try {
      response = await fetch('/monitoring/data', { cache: 'no-store' });
    } catch {
      return;
    }
    if (!response.ok) return;

    const payload = await response.json();
    const rows = (payload && payload.rows) ? payload.rows : [];
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No rows yet.</td></tr>';
      return;
    }

    body.innerHTML = rows.map(renderRow).join('');
  }

  poll();
  setInterval(poll, refreshMs);
})();
</script>
{{end}}
