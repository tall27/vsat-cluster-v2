name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go test ./...

      - name: Build linux/amd64 binary
        run: GOOS=linux GOARCH=amd64 go build -o out/vsat-webapp ./cmd/vsat-webapp

      - name: Package release assets
        run: |
          mkdir -p out/release
          cp out/vsat-webapp out/release/
          tar -C . -czf out/release/scripts.tar.gz scripts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/release/vsat-webapp
            out/release/scripts.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
